name: Finlume CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Lint, Test, & Docker checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: finlume-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 slowapi python-json-logger

      - name: Run Backend Linting
        working-directory: finlume-backend
        env:
          PYTHONPATH: ${{ github.workspace }}/finlume-backend
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Tests
        working-directory: finlume-backend
        env:
          PYTHONPATH: ${{ github.workspace }}/finlume-backend
        run: |
          pytest tests/ -v

  frontend-checks:
    name: Frontend Lint & Build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Frontend Dependencies
        working-directory: finlume-frontend
        run: |
          npm ci

      - name: Validate React Build
        working-directory: finlume-frontend
        run: |
          npm run build

  docker-compose-test:
    name: Validate Docker Compose Assembly
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dry-Run Docker Compose Config
        run: docker compose config

      - name: Build Images
        run: docker compose build

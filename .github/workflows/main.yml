name: Finlume CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Lint, Test, & Docker checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finlume
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: finlume-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 slowapi python-json-logger alembic psycopg2-binary httpx

      - name: Run Backend Linting
        working-directory: finlume-backend
        env:
          PYTHONPATH: ${{ github.workspace }}/finlume-backend
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Database Migrations
        working-directory: finlume-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finlume
        run: |
          alembic upgrade head

      - name: Run Backend Tests
        working-directory: finlume-backend
        env:
          PYTHONPATH: ${{ github.workspace }}/finlume-backend
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finlume
          JWT_SECRET: test-secret
          JWT_ALGORITHM: HS256
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_API_KEY: dummy-test-key
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-3-5-sonnet
          ANTHROPIC_API_KEY: dummy-test-key
          FRONTEND_ORIGIN: http://localhost:5173
        run: |
          pytest tests/ -v

  frontend-checks:
    name: Frontend Lint & Build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: finlume-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: finlume-frontend
        run: |
          npm ci

      - name: Validate React Build
        working-directory: finlume-frontend
        run: |
          npm run build

  docker-compose-test:
    name: Validate Docker Compose Assembly
    needs:
      - backend-checks
      - frontend-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dry-Run Docker Compose Config
        run: docker compose config

  deploy-railway:
    name: Deploy to Railway (Placeholder)
    needs:
      - backend-checks
      - frontend-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo 'Error: RAILWAY_TOKEN is not set.'
            echo 'Deployment blocked until Railway access is provisioned.'
            exit 1
          fi
          echo 'Deploying to Railway... (Placeholder)'
          # railway up --detach
